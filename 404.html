<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELHSSOC | About Us</title>
    <link rel="icon" type="image/ico" href="favicon.ico">

    <link href="./global.css" type="text/css" rel="stylesheet">
    <style>
        .error-container { display:flex; justify-content:center; align-items:center; min-height:60vh; color:var(--text); }
        .error-card { text-align:center; width:90%; max-width:900px; padding:3rem 1.5rem; border-radius:12px; background-color:var(--white); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        body.dark-mode .error-card { background-color:var(--color-dark); }
        .error-code { font-size:8vh; margin:0.2rem 0; color:var(--color-text); }
        .error-message { font-size:2.6vh; color:var(--text); margin:0.5rem 0 1.2rem 0; opacity:0.95; }
        .error-actions { display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:1rem; }
        .error-actions a { display:inline-block; padding:0.8rem 1.2rem; border-radius:8px; background:var(--color-medium); color:var(--color-text); text-decoration:none; font-weight:600; }
        .error-actions a.secondary { background:transparent; color:var(--text); border:2px solid var(--color-medium); }
        .error-actions a:hover { filter:brightness(0.96); transform:translateY(-2px); }
        .error-links { color:var(--text); margin-top:0.8rem; }
        .error-links a { color:var(--color-light); text-decoration:underline; margin:0 0.4rem; }
    </style>
    <script src="https://unpkg.com/m-html-utils@1.3.1/dist/m-html-utils.min.js"></script>
    <script src="./scripts/index.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</head>
<body>
    <m-spacer height="10vh"></m-spacer>

    <main class="error-container" role="main">
        <div class="error-card">
            <div style="display:flex;justify-content:center;align-items:center;gap:1rem;margin-bottom:0.6rem;">
                <ion-icon name="sad-outline" style="font-size:8vh;color:var(--color-medium)"></ion-icon>
            </div>

            <h1 class="error-code">404</h1>
            <p class="error-message">Sorry — the page you were looking for cannot be found.</p>

            <div class="error-actions">
                <a href="index.html">Return Home</a>
                <a href="mailto:team@elhssoc.com?subject=404%20report" class="secondary">Report a Problem</a>
            </div>

            <p class="error-links">Or try: <a href="about.html">About</a> · <a href="schedule.html">Schedule</a> · <a href="tournaments.html">Tournaments</a> · <a href="socials.html">Socials</a></p>
        </div>
    </main>

    <m-spacer height="24vh"></m-spacer>

    <script>menuInit()</script>
</body>
