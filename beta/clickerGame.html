<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathogen Clicker</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #22c55e;
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        /* Left Column: The Pathogen */
        .click-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px solid #334155;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }
        #pathogen {
            width: 250px;
            height: 250px;
            background: #22c55e;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 50px rgba(34, 197, 94, 0.3);
            transition: transform 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            position: relative;
        }
        #pathogen:active { transform: scale(0.95); }
        #pathogen::after {
            content: '';
            position: absolute;
            width: 110%;
            height: 110%;
            border: 4px dashed var(--accent);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Right Column: Upgrades */
        .shop {
            width: 400px;
            background-color: var(--panel);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        .header { margin-bottom: 20px; text-align: center; }
        .dna-display { font-size: 32px; font-weight: bold; color: var(--accent); }
        .stat-sub { font-size: 14px; color: var(--muted); }

        .upgrade-card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .upgrade-card:hover { border-color: var(--accent); background: #3f4e63; }
        .upgrade-card.disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        .upgrade-name { font-weight: bold; display: block; }
        .upgrade-cost { font-size: 14px; color: var(--accent); }
        .upgrade-desc { font-size: 12px; color: var(--muted); display: block; margin-top: 5px; }

        .floating-text {
            position: absolute;
            color: var(--accent);
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            to { transform: translateY(-100px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="click-area">
        <div class="header">
            <div class="dna-display" id="total-dna">0 DNA</div>
            <div class="stat-sub" id="dna-per-sec">Generating: 0/sec</div>
        </div>
        <div id="pathogen">🦠</div>
        <p style="margin-top: 40px; color: var(--muted);">Click the Pathogen to Evolve</p>
        <button onclick="resetGame()" style="margin-top: 10px; background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Wipe Lab (Reset)</button>
    </div>

    <div class="shop">
        <h2 style="margin-top: 0;">Mutations & Vectors</h2>
        <div id="upgrade-list">
            <!-- Upgrades will be generated here -->
        </div>
    </div>

    <script>
        // Game State
        let state = {
            dna: 0,
            totalDNA: 0,
            clickValue: 1,
            autoDNA: 0,
            upgrades: {
                spikes: { count: 0, cost: 15, baseCost: 15, power: 1, type: 'click', name: "Protein Spikes", desc: "+1 DNA per click" },
                bacteria: { count: 0, cost: 100, baseCost: 100, power: 1, type: 'auto', name: "Bacterial Symbiosis", desc: "+1 DNA per second" },
                droplets: { count: 0, cost: 500, baseCost: 500, power: 5, type: 'auto', name: "Aerosol Droplets", desc: "+5 DNA per second" },
                zoonotic: { count: 0, cost: 2500, baseCost: 2500, power: 25, type: 'auto', name: "Zoonotic Shift", desc: "+25 DNA per second" },
                resistance: { count: 0, cost: 10000, baseCost: 10000, power: 100, type: 'auto', name: "Antibiotic Resistance", desc: "+100 DNA per second" }
            }
        };

        // Initialize from LocalStorage
        function loadGame() {
            const saved = localStorage.getItem('pathogenClickerData');
            if (saved) {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
            }
            renderUpgrades();
            updateDisplay();
        }

        function saveGame() {
            localStorage.setItem('pathogenClickerData', JSON.stringify(state));
        }

        function updateDisplay() {
            document.getElementById('total-dna').innerText = `${Math.floor(state.dna)} DNA`;
            document.getElementById('dna-per-sec').innerText = `Generating: ${state.autoDNA}/sec | Power: ${state.clickValue}`;
            
            // Toggle disabled state for shop items
            Object.keys(state.upgrades).forEach(id => {
                const card = document.getElementById(`upgrade-${id}`);
                if (state.dna < state.upgrades[id].cost) {
                    card.classList.add('disabled');
                } else {
                    card.classList.remove('disabled');
                }
            });
        }

        function renderUpgrades() {
            const list = document.getElementById('upgrade-list');
            list.innerHTML = '';
            Object.keys(state.upgrades).forEach(id => {
                const up = state.upgrades[id];
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.id = `upgrade-${id}`;
                card.onclick = () => buyUpgrade(id);
                card.innerHTML = `
                    <span class="upgrade-name">${up.name} (Lvl ${up.count})</span>
                    <span class="upgrade-cost">Cost: ${up.cost} DNA</span>
                    <span class="upgrade-desc">${up.desc}</span>
                `;
                list.appendChild(card);
            });
        }

        function buyUpgrade(id) {
            const up = state.upgrades[id];
            if (state.dna >= up.cost) {
                state.dna -= up.cost;
                up.count++;
                
                if (up.type === 'click') {
                    state.clickValue += up.power;
                } else {
                    state.autoDNA += up.power;
                }

                // Increase cost exponentially (standard clicker formula)
                up.cost = Math.floor(up.baseCost * Math.pow(1.15, up.count));
                
                renderUpgrades();
                updateDisplay();
                saveGame();
            }
        }

        // Click Handling
        document.getElementById('pathogen').addEventListener('click', (e) => {
            state.dna += state.clickValue;
            state.totalDNA += state.clickValue;
            
            createFloatingText(e.clientX, e.clientY, `+${state.clickValue}`);
            updateDisplay();
        });

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Auto DNA loop (10 times per second for smoothness)
        setInterval(() => {
            if (state.autoDNA > 0) {
                state.dna += (state.autoDNA / 10);
                updateDisplay();
            }
        }, 100);

        // Auto save every 30 seconds
        setInterval(saveGame, 30000);

        function resetGame() {
            if(confirm("Are you sure you want to delete all lab data? This cannot be undone.")) {
                localStorage.removeItem('pathogenClickerData');
                location.reload();
            }
        }

        loadGame();
    </script>
</body>
</html>
