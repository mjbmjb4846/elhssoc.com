<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East Lansing Science Olympiad</title>
    <link rel="icon" type="image/ico" href="favicon.ico">

    <link href="./global.css" type="text/css" rel="stylesheet">
    <script src="https://unpkg.com/m-html-utils@1.3.1/dist/m-html-utils.min.js"></script>
    <script src="./scripts/index.js"></script>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</head>

<body>

    <m-spacer class="computer-only" height="8vh" color="var(--color-medium)"></m-spacer>

    <m-announcement class="slidedown"></m-announcement>

    <m-title class="slidedown" height="86vh" background="./images/SO2025/SOstateTeamResults.webp" zoom="cover" x="51%" brightness="0.75">Welcome to<br>East Lansing High School<br>Science Olympiad!</m-title>
    
    <m-spacer></m-spacer>

    <m-alt-title>We Meet Fridays<br>from 2:45 – 4:00 PM in the<br>ELHS Media Center!</m-alt-title>

    <m-spacer></m-spacer>

    <div class="button-grid">
        <m-button text="Google Drive" highlight="var(--google)" ionIcon="logo-google" svg="./images/logos/drive_logo_2026.svg" link="https://drive.google.com/drive/u/2/folders/1JBugPu2x9Fg-eLQgXx_5FLUu2-r4skda"></m-button>
        <m-button text="Our Discord" highlight="var(--discord)" ionIcon="logo-discord" svg="./images/logos/discord_logo.svg" link="https://discord.gg/emGvbVwZjk"></m-button>
        <m-button text="SciOly Resources" highlight="var(--scioly)" ionIcon="server-outline" link="https://scioly.org/"></m-button>
    </div>

    <m-spacer height="8vh"></m-spacer>

    <div class="double-page">
        <div class="text-segment">
            <m-alt-title format="left">Executive Board Contact Information:</m-alt-title>

            <m-spacer></m-spacer>

            <m-info name="Ben Lu" role="President" email="bangjian.lu@stu.elps.us" bio="To be determined..."></m-info>
            <m-info name="Jacob Drexler" role="Vice President" email="jacob.drexler@stu.elps.us" bio="To be determined..."></m-info>
            <m-info name="Joe Barger" role="Treasurer" email="joseph.barger@stu.elps.us" bio="To be determined..."></m-info>
            <m-info name="Eleanor Hamlin" role="Secretary" email="eleanor.hamlin@stu.elps.us" bio="Hi everyone! I'm SOC secretary for 26-27, let's have a great year!"></m-info>
            <m-info name="Rosemary Cha" role="Publicist" email="ai.cha@stu.elps.us" bio="Send in pictures from tournaments and events!"></m-info>

            <m-spacer height="8vh"></m-spacer>

            <div style="background-color: var(--color-light-gray); padding: 15px 0;">
                <a href="https://www.jackson.com/" target="_blank" rel="noopener noreferrer"><img src="images/logos/jacksonNationalLogo.svg" width="80%" style="margin: 0 10%" alt="Jackson National Life logo"></a>
            </div>

            <m-spacer height="8vh"></m-spacer>
            
            <div class="alex-container gform">
                <iframe title="Contact Form" src="https://docs.google.com/forms/d/e/1FAIpQLSf8W3xAdi89bZRGrY-_sdP9wgJlDGo_7kXRGnHu8VgXAoTFWQ/viewform?embedded=true" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </div>
        
        <div class="media-segment">
            <a href="https://www.elef.us/" target="_blank" rel="noopener noreferrer"><img src="images/logos/ELEFlogo.png" width="80%" style="margin: 0 10%" alt="ELEF logo"></a>

            <m-spacer height="8vh"></m-spacer>

            <div class="log-container gform">
                <!-- OLD FORM: https://docs.google.com/forms/d/e/1FAIpQLSdXxRdFcznediqgrImF69g5yI9CsPlsueasmvFr1qqqRLB-Tw/viewform?embedded=true -->
                <iframe title="Log Form" src="https://docs.google.com/forms/d/e/1FAIpQLSfWppfTsx0KwdOjtTNA5UG0LBMs0VVzO768VqlhUr1wpUJeNg/viewform?embedded=true" width="100%" height="100%" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
            </div>
        </div>
    </div>

    <script>menuInit()</script>

</body>

</html>
